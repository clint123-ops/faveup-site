<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#36D6C6">
<meta name="color-scheme" content="light">
<title>FaveUp – Panel Cukiernia Zalewski</title>

<link rel="icon" type="image/png" href="../qr-assets/assets/faveup-icon.png">
<link rel="apple-touch-icon" href="../qr-assets/assets/faveup-icon.png">
<link rel="stylesheet" href="../qr-assets/css/admin.css">
<meta name="robots" content="noindex,nofollow">
</head>
<body>

<header class="site-header">
  <div class="site-header__strip"></div>
  <div class="site-header__bar">
    <div class="brand">
      <img src="../qr-assets/assets/faveup-icon.png" alt="" class="brand__logo" width="47" height="47">
      <div class="brand__text">
        <span class="brand__name">FaveUp</span>
        <span class="brand__motto" data-t="motto">Tworzone z ❤️ dla lokalnych firm i ich społeczności</span>
      </div>
    </div>
    
  </div>
</header>

<main class="admin" id="app">
  <section class="login" id="login" hidden>
    <div class="login__card">
      <div class="login__icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></div>
      <h1>Panel FaveUp</h1>
      <p class="muted">Zaloguj się kontem administratora Supabase.</p>
      <form id="login-form">
        <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
        <label>Hasło<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn btn--primary" type="submit">Zaloguj</button>
        <p class="form-error" id="login-error" role="alert" hidden></p>
      </form>
    </div>
  </section>

  <section class="dash" id="dash" hidden>
    <div class="dash__top">
      <div class="place-pick">
        <img id="place-logo" alt="" width="44" height="44">
        <select id="place-select" aria-label="Miejsce"></select>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab is-active" role="tab" data-tab="list" aria-selected="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Zapisy</button>
        <button class="tab" role="tab" data-tab="qr" aria-selected="false"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg> Kod QR</button>
      </nav>
      <div class="dash__user"><span id="user-email" class="muted"></span><button class="btn btn--ghost" id="logout" title="Wyloguj"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button></div>
    </div>

    <div class="tabpanel" id="tab-list">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Szukaj e-maila…" aria-label="Szukaj e-maila">
        <select id="status-filter" aria-label="Filtr statusu">
          <option value="">Wszystkie statusy</option>
          <option value="pending">Oczekuje</option>
          <option value="queued">Wysyłanie…</option>
          <option value="sent">Wysłano</option>
          <option value="error">Błąd</option>
        </select>
        <span class="toolbar__spacer"></span>
        <button class="btn" id="refresh"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Odśwież</button>
        <button class="btn" id="export"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg> CSV</button>
        <button class="btn btn--primary" id="send-pending" disabled><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg> <span>Wyślij kod do oczekujących</span></button>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Data</th><th>Imię</th><th>E-mail</th><th>Źródło</th><th>Kod</th><th>Status</th><th class="right">Akcja</th></tr></thead>
          <tbody id="rows"><tr><td colspan="7" class="muted center">Ładowanie…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="tabpanel" id="tab-qr" hidden>
      <div class="qr-card">
        <div class="qr-card__preview"><img id="qr-img" alt="Kod QR"></div>
        <div class="qr-card__info">
          <h2>Kod QR do druku</h2>
          <p class="muted">Prowadzi do: <a id="qr-link" target="_blank" rel="noopener"></a></p>
          <p class="muted small">Parametr <code>?qr=1</code> liczy skany osobno od zwykłych wejść.</p>
          <div class="qr-card__actions">
            <a class="btn btn--primary" id="qr-svg" download><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg> SVG (druk)</a>
            <button class="btn" id="qr-png"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg> PNG 2048 px</button>
            <button class="btn" id="qr-copy"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> Kopiuj link</button>
            <a class="btn" id="qr-open" target="_blank" rel="noopener"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg> Otwórz stronę</a>
          </div>
          <div class="legacy" id="legacy" hidden></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <div class="modal__actions"><button class="btn" data-modal="cancel">Anuluj</button><button class="btn btn--primary" data-modal="ok">Wyślij</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<template data-icon-tpl="info"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></template>
<template data-icon-tpl="send"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></template>

</body>
</html>
